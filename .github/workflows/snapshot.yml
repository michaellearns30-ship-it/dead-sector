name: Publish dated build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the current build
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://site-9ff8c8b6cb144074b0d31eb8e437724b.freebuff.page/" -o index.html
          grep -q "Dead Sector" index.html
          test "$(wc -c < index.html)" -gt 200000
          wc -c index.html
          cp index.html "Dead-Sector-$(date -u +%F).html"
          echo "dated copy: Dead-Sector-$(date -u +%F).html"

      - name: Commit and push
        run: |
          set -euo pipefail
          DAY=$(date -u +%F)
          git config user.name "dead-sector-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "Dead-Sector-$DAY.html"
          if git diff --staged --quiet; then echo "already up to date"; exit 0; fi
          git commit -m "Publish Dead Sector build $DAY"
          git push
